<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedBuddy - Registration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/pages/registration.css">
  <style>
    body {
      background: linear-gradient(135deg, #023e8a, #0077b6, #90e0ef);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card {
      border-radius: 20px;
      box-shadow: 0px 8px 25px rgba(0,0,0,0.25);
      background: #ffffff;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      max-width: 420px;
      width: 100%;
      padding: 30px;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0px 12px 30px rgba(0,0,0,0.3);
    }
    h3 {
      color: #0077b6;
      font-weight: 600;
      text-align: center;
      margin-bottom: 20px;
    }
    .form-control {
      border-radius: 12px;
      padding: 10px;
      transition: all 0.3s ease;
      border: 1px solid #ccc;
    }
    .form-control:focus {
      border-color: #0077b6;
      box-shadow: 0px 0px 8px rgba(0,119,182,0.5);
    }
    .btn-primary {
      background: linear-gradient(135deg, #0077b6, #023e8a);
      border: none;
      border-radius: 12px;
      padding: 10px;
      font-weight: bold;
      transition: all 0.3s ease;
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #0096c7, #03045e);
      transform: scale(1.05);
      box-shadow: 0px 4px 15px rgba(0, 119, 182, 0.4);
    }
    .alert {
      border-radius: 12px;
      margin-top: 10px;
    }
    .card p a {
      color: #0077b6;
      font-weight: 500;
      text-decoration: none;
    }
    .card p a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="card shadow-lg">
    <h3>Create Account</h3>

    <div id="alertBox"></div>

    <form id="registrationForm">
      <div class="mb-3">
        <label for="username" class="form-label"><strong>Username</strong></label>
        <input type="text" id="username" class="form-control" placeholder="Enter username" required>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label"><strong>Email</strong></label>
        <input type="email" id="email" class="form-control" placeholder="Enter email" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label"><strong>Password</strong></label>
        <input type="password" id="password" class="form-control" placeholder="Enter password" required>
      </div>
      <div class="mb-3">
        <label for="confirmPassword" class="form-label"><strong>Confirm Password</strong></label>
        <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter password" required>
      </div>
      <div class="mb-3">
        <label for="phone" class="form-label"><strong>Phone (Optional)</strong></label>
        <input type="tel" id="phone" class="form-control" placeholder="10-digit phone number">
      </div>
      <button type="submit" class="btn btn-primary w-100">Register</button>
    </form>

    <p class="text-center mt-3">
      Already have an account? <a href="login.html">Login here</a>
    </p>
  </div>

  <script src="js/medbuddy.js"></script>
  <script>
    const form = document.getElementById("registrationForm");
    const alertBox = document.getElementById("alertBox");

    form.addEventListener("submit", function(e) {
      e.preventDefault();
      alertBox.innerHTML = "";

      const username = document.getElementById("username").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const confirmPassword = document.getElementById("confirmPassword").value.trim();
      const phone = document.getElementById("phone").value.trim();

      // Basic validation
      if(password !== confirmPassword) {
        return showAlert("❌ Passwords do not match.", "danger");
      }
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        return showAlert("❌ Invalid email format.", "danger");
      }
      if(phone && !/^\d{10}$/.test(phone)) {
        return showAlert("❌ Phone number must be 10 digits.", "danger");
      }

      // Get existing users
      let users = JSON.parse(localStorage.getItem("users")) || [];

      // Check duplicates
      if(users.some(u => u.username.toLowerCase() === username.toLowerCase() || u.email.toLowerCase() === email.toLowerCase())) {
        return showAlert("⚠️ Username or email already exists.", "warning");
      }

      // Add new user
      users.push({ username, email, password, phone });
      localStorage.setItem("users", JSON.stringify(users));

      showAlert("✅ Registration successful! Redirecting to login...", "success");

      setTimeout(() => window.location.href = "login.html", 2000);
    });

    function showAlert(message, type="info") {
      alertBox.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
    }
  </script>

</body>
</html>
