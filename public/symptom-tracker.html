<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Symptom Tracker - MedBuddy</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/pages/symptom-tracker.css">
  <link rel="stylesheet" href="css/theme.css">
</head>
<body>
  <nav class="mb-4">
    <ul class="nav justify-content-center">
      <li class="nav-item"><a class="nav-link text-gradient" href="index.html">Home</a></li>
      <li class="nav-item"><a class="nav-link text-gradient" href="dashboard.html">Dashboard</a></li>
      <li class="nav-item"><a class="nav-link text-gradient" href="login.html">Login</a></li>
      <li class="nav-item"><a class="nav-link text-gradient" href="registration.html">Register</a></li>
      <li class="nav-item"><a class="nav-link text-gradient" href="profile.html">Profile</a></li>
      <li class="nav-item"><a class="nav-link text-gradient" href="appointments.html">Appointments</a></li>
      <li class="nav-item"><a class="nav-link text-gradient" href="symptom-tracker.html">Symptoms</a></li>
      <li class="nav-item"><a class="nav-link text-gradient" href="medication.html">Medications</a></li>
      <li class="nav-item"><a class="nav-link text-gradient" href="payment.html">Payments</a></li>
      <li class="nav-item"><a class="nav-link text-gradient" href="settings.html">Settings</a></li>
      <li class="nav-item"><a class="nav-link text-gradient" href="health-insights.html">Health Insights</a></li>
    </ul>
  </nav>
  <div class="container py-5 d-flex justify-content-center align-items-center" style="min-height:100vh;">
    <div class="card-surface p-4" style="max-width:400px;width:100%;">
      <div class="text-center mb-4">
        <img src="images/medbuddy_logo.png" alt="MedBuddy Logo" class="logo mb-2">
        <h2 class="text-gradient">Symptom Tracker</h2>
        <p class="text-muted">Log and review your symptoms</p>
      </div>
      <form id="symptomForm">
        <div class="mb-3">
          <label for="symptom" class="form-label">Symptom</label>
          <input type="text" class="form-control" id="symptom" required>
        </div>
        <div class="mb-3">
          <label for="notes" class="form-label">Notes</label>
          <textarea class="form-control" id="notes" rows="2"></textarea>
        </div>
        <button type="submit" class="btn-action w-100">Log Symptom</button>
      </form>
      <div class="mt-3 text-center">
        <a href="dashboard.html" class="text-gradient">Back to Dashboard</a>
      </div>
    </div>
  </div>
  <script src="js/medbuddy.js"></script>
  <script>
    document.getElementById('symptomForm').addEventListener('submit', function(e) {
      e.preventDefault();
      alert('Symptom logged!');
    });
  </script>
</body>
</html>
