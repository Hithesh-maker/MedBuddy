<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile - MedBuddy</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/pages/profile.css">
  <style>
    body {
      background: linear-gradient(135deg, #152b42, #0d1b2a);
      color: #e0e6ed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .profile-container {
      background: #1f3b5a;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 500px;
    }
    h2 {
      text-align: center;
      margin-bottom: 10px;
      color: #32c3ff;
      text-shadow: 0 0 8px rgba(50,195,255,0.5);
    }
    #dateAdded {
      text-align: center;
      margin-bottom: 20px;
      color: #90e0ef;
      font-style: italic;
    }
    .btn-warning {
      background: linear-gradient(135deg, #32c3ff, #0077b6);
      border: none;
      color: white;
      font-weight: bold;
      transition: all 0.3s ease;
    }
    .btn-warning:hover {
      background: linear-gradient(135deg, #48cae4, #0096c7);
      transform: scale(1.05);
      box-shadow: 0px 4px 12px rgba(50,195,255,0.55);
    }
    .logout-btn, .back-btn {
      display: block;
      margin: 15px auto 0 auto;
      text-align: center;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      padding: 10px 20px;
      transition: all 0.3s ease;
      cursor: pointer;
    }
    .logout-btn {
      background: #ff4d4d;
      color: white;
    }
    .logout-btn:hover {
      background: #ff1a1a;
      transform: scale(1.05);
      box-shadow: 0 4px 12px rgba(255,0,0,0.5);
    }
    .back-btn {
      background: #32c3ff;
      color: white;
    }
    .back-btn:hover {
      background: #48cae4;
      transform: scale(1.05);
      box-shadow: 0 4px 12px rgba(50,195,255,0.5);
    }
  </style>
</head>
<body>
  <div class="profile-container">
    <h2>User Profile</h2>
    <div id="dateAdded">Date Added: N/A</div>
    <form id="profileForm">
      <div class="mb-3">
        <label for="username" class="form-label">Name</label>
        <input type="text" id="username" class="form-control" placeholder="Enter name" required disabled>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email (Locked)</label>
        <input type="email" id="email" class="form-control" disabled>
      </div>
      <div class="mb-3">
        <label for="address" class="form-label">Address</label>
        <input type="text" id="address" class="form-control" placeholder="Enter address" required disabled>
      </div>
      <div class="mb-3">
        <label for="phone" class="form-label">Phone</label>
        <input type="tel" id="phone" class="form-control" placeholder="Enter phone number" required disabled>
      </div>
      <button type="submit" class="btn btn-warning w-100" id="saveBtn">Edit Profile</button>
    </form>

    <button class="back-btn" id="backHomeBtn">Back to Home</button>
    <button class="logout-btn" id="logoutBtn">Logout</button>
  </div>

  <script>
    const currentUser = JSON.parse(localStorage.getItem("currentUser"));

    if (!currentUser) {
      alert("⚠️ Please login first!");
      window.location.href = "login.html";
    }

    const usernameInput = document.getElementById("username");
    const emailInput = document.getElementById("email");
    const addressInput = document.getElementById("address");
    const phoneInput = document.getElementById("phone");
    const dateAddedDiv = document.getElementById("dateAdded");
    const saveBtn = document.getElementById("saveBtn");

    // Load profile data from server
    async function loadProfile() {
      try {
        const res = await fetch(`http://localhost:3000/profile/${currentUser.emailId}`);
        const data = await res.json();
        if (data.success) {
          usernameInput.value = data.profile.username;
          emailInput.value = data.profile.email;
          addressInput.value = data.profile.address || "";
          phoneInput.value = data.profile.phone || "";
          dateAddedDiv.textContent = `Date Added: ${data.profile.dateAdded || new Date().toLocaleString()}`;
        }
      } catch (err) {
        console.error(err);
        alert("⚠️ Could not fetch profile data. Using local storage fallback.");
        usernameInput.value = currentUser.userName;
        emailInput.value = currentUser.emailId;
      }
    }

    loadProfile();

    // Toggle Edit/Update
    saveBtn.addEventListener("click", async function(e) {
      e.preventDefault();

      if (saveBtn.textContent === "Edit Profile") {
        usernameInput.disabled = false;
        addressInput.disabled = false;
        phoneInput.disabled = false;
        saveBtn.textContent = "Update Profile";
        return;
      }

      // Validate input
      const username = usernameInput.value.trim();
      const address = addressInput.value.trim();
      const phone = phoneInput.value.trim();

      if (!username || !address || !phone) {
        alert("⚠️ All fields are required!");
        return;
      }
      if (!/^[0-9]{10}$/.test(phone)) {
        alert("⚠️ Phone number must be 10 digits!");
        return;
      }

      // Update profile via server
      try {
        const res = await fetch(`http://localhost:3000/profile/${currentUser.emailId}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, address, phone })
        });
        const data = await res.json();
        if (data.success) {
          alert("✅ Profile updated successfully!");
          usernameInput.disabled = true;
          addressInput.disabled = true;
          phoneInput.disabled = true;
          saveBtn.textContent = "Edit Profile";
        } else {
          alert("❌ Could not update profile.");
        }
      } catch (err) {
        console.error(err);
        alert("⚠️ Error updating profile. Try again later.");
      }
    });

    document.getElementById("backHomeBtn").addEventListener("click", () => {
      window.location.href = "index.html";
    });

    document.getElementById("logoutBtn").addEventListener("click", () => {
      localStorage.removeItem("currentUser");
      alert("You have logged out ✅");
      window.location.href = "login.html";
    });
  </script>
</body>
</html>
